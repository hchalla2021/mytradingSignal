version: '3.8'

services:
  # Redis Cache (Optional but recommended for production)
  redis:
    image: redis:7-alpine
    container_name: trading-redis
    restart: unless-stopped
    expose:
      - "6379"
    command: redis-server --maxmemory 256mb --maxmemory-policy allkeys-lru
    volumes:
      - redis-data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 3

  # Backend API Server
  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: trading-backend
    restart: always
    ports:
      - "8000:8000"
    env_file:
      - ${BACKEND_ENV_FILE:-./backend/.env}
    environment:
      # Override with container-specific settings
      - PORT=8000
      - HOST=0.0.0.0
      - DEBUG=false
      - FRONTEND_URL=${PRODUCTION_FRONTEND_URL:-https://mydailytradesignals.com}
      - CORS_ORIGINS=${PRODUCTION_CORS_ORIGINS:-https://mydailytradesignals.com}
      - REDIRECT_URL=${PRODUCTION_REDIRECT_URL:-https://mydailytradesignals.com/api/auth/callback}
      - AUTONOMIQ_PRO_DEPLOYMENT_MODE=production
      - AQTE_LIVE_DEPLOYMENT_MODE=production
      - QUANTUMEDGE_DEPLOYMENT_MODE=production
      - ZERODHA_SHARED_AUTH_FILE=/run/zerodha/credentials.json
      # ✅ CRITICAL FIX: Use container name, not localhost
      - REDIS_URL=redis://redis:6379
      # CRITICAL: Enable scheduler for automatic market hours management
      - ENABLE_SCHEDULER=true
      - ORDER_FLOW_DB_PATH=/app/data/order_flow/order_flow.sqlite3
    volumes:
      # Mount .env for token hot-reload (token watcher)
      - ${BACKEND_ENV_FILE:-./backend/.env}:/app/.env
      - zerodha-auth-data:/run/zerodha
      # Mount logs directory (optional)
      - ./backend/logs:/app/logs
      - order-flow-data:/app/data/order_flow
      - autonomiq-pro-data:/app/data/autonomiq_pro
      - aqte-data:/app/data/aqte
      - expiryedge-data:/app/data/expiryedge
    depends_on:
      redis:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/health', timeout=5).close()"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 40s
    command: ["uvicorn", "main:app", "--host", "0.0.0.0", "--port", "8000", "--workers", "1"]

  # Standalone MorningEdge service with independent credentials and state.
  morningedge-api:
    build:
      context: ./morningedge
      dockerfile: Dockerfile
    container_name: morningedge-api
    restart: unless-stopped
    env_file:
      - ./morningedge/.env
    environment:
      - MORNINGEDGE_DB_PATH=/app/data/morningedge.sqlite3
      - MORNINGEDGE_BACKEND_ENV_FILE=/run/backend/.env
    volumes:
      - morningedge-data:/app/data
      - ${BACKEND_ENV_FILE:-./backend/.env}:/run/backend/.env:ro
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8010/health', timeout=5).close()"]
      interval: 20s
      timeout: 5s
      retries: 3
      start_period: 20s

  openingedge-api:
    build:
      context: ./openingedge
      dockerfile: Dockerfile
    restart: unless-stopped
    environment:
      - OPENINGEDGE_DB_PATH=/app/data/openingedge.sqlite3
      - OPENINGEDGE_BACKEND_ENV_FILE=/run/backend/.env
    volumes:
      - openingedge-data:/app/data
      - ${BACKEND_ENV_FILE:-./backend/.env}:/run/backend/.env:ro
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8012/health', timeout=5).close()"]
      interval: 30s
      timeout: 5s
      retries: 3

  # Frontend Next.js Server
  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    container_name: trading-frontend
    restart: unless-stopped
    ports:
      - "3000:3000"
    environment:
      # NOTE: NEXT_PUBLIC_* vars are baked into the Next.js build at image build time.
      # They CANNOT be overridden at container runtime via environment:.
      # .env.local is excluded from the image context. Without baked-in public URLs,
      # the frontend uses same-origin API/WebSocket URLs; proxy /api and /ws to backend.
      - NODE_ENV=production
      - MORNINGEDGE_API_URL=http://morningedge-api:8010
      - OPENINGEDGE_API_URL=http://openingedge-api:8012
      - BACKEND_API_URL=http://backend:8000
    depends_on:
      - backend
      - morningedge-api
    healthcheck:
      test: ["CMD", "node", "-e", "const http=require('http'); const req=http.get('http://127.0.0.1:3000/',res=>{res.resume();if(res.statusCode<200||res.statusCode>=400)process.exit(1)});req.setTimeout(5000,()=>req.destroy(new Error('Health check timeout')));req.on('error',()=>process.exit(1));"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 60s

# Docker Networks
networks:
  default:
    name: trading-network

# Persistent Volumes
volumes:
  redis-data:
  order-flow-data:
  autonomiq-pro-data:
  aqte-data:
  expiryedge-data:
  morningedge-data:
  openingedge-data:
  zerodha-auth-data:
    name: mytrading-zerodha-auth
