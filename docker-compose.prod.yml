version: '3.8'

services:
  # Redis Cache (Optional but recommended for production)
  redis:
    image: redis:7-alpine
    container_name: trading-redis
    restart: unless-stopped
    expose:
      - "6379"
    command: redis-server --maxmemory 256mb --maxmemory-policy allkeys-lru
    volumes:
      - redis-data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 3

  # Backend API Server
  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: trading-backend
    restart: always
    ports:
      - "8000:8000"
    env_file:
      - ./backend/.env
    environment:
      # Override with container-specific settings
      - PORT=8000
      - HOST=0.0.0.0
      # ✅ CRITICAL FIX: Use container name, not localhost
      - REDIS_URL=redis://redis:6379
      # CRITICAL: Enable scheduler for automatic market hours management
      - ENABLE_SCHEDULER=true
      - ORDER_FLOW_DB_PATH=/app/data/order_flow/order_flow.sqlite3
    volumes:
      # Mount .env for token hot-reload (token watcher)
      - ./backend/.env:/app/.env
      # Persist access token across restarts
      - ./backend/access_token.txt:/app/access_token.txt
      # Mount logs directory (optional)
      - ./backend/logs:/app/logs
      - paper-trading-data:/app/data/paper_trading
      - order-flow-data:/app/data/order_flow
      - aqte-data:/app/data/aqte
    depends_on:
      redis:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/health', timeout=5).close()"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 40s
    command: ["uvicorn", "main:app", "--host", "0.0.0.0", "--port", "8000", "--workers", "1"]

  # Frontend Next.js Server
  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    container_name: trading-frontend
    restart: unless-stopped
    ports:
      - "3000:3000"
    environment:
      # NOTE: NEXT_PUBLIC_* vars are baked into the Next.js build at image build time.
      # They CANNOT be overridden at container runtime via environment:.
      # .env.local is excluded from the image context. Without baked-in public URLs,
      # the frontend uses same-origin API/WebSocket URLs; proxy /api and /ws to backend.
      - NODE_ENV=production
    depends_on:
      - backend
    healthcheck:
      test: ["CMD", "node", "-e", "const http=require('http'); const req=http.get('http://127.0.0.1:3000/',res=>{res.resume();if(res.statusCode<200||res.statusCode>=400)process.exit(1)});req.setTimeout(5000,()=>req.destroy(new Error('Health check timeout')));req.on('error',()=>process.exit(1));"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 60s

# Docker Networks
networks:
  default:
    name: trading-network

# Persistent Volumes
volumes:
  redis-data:
  paper-trading-data:
  order-flow-data:
  aqte-data:
