services:
  morningedge-api:
    build:
      context: ./morningedge
      dockerfile: Dockerfile
    restart: unless-stopped
    env_file:
      - ./morningedge/.env
    environment:
      MORNINGEDGE_DB_PATH: /app/data/morningedge.sqlite3
      MORNINGEDGE_BACKEND_ENV_FILE: /run/backend/.env
    ports:
      - "127.0.0.1:8010:8010"
    volumes:
      - morningedge-data:/app/data
      - ./backend/.env:/run/backend/.env:ro
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8010/health', timeout=5).close()"]
      interval: 20s
      timeout: 5s
      retries: 3
      start_period: 20s

volumes:
  morningedge-data:
